# Render Blueprint for the OmniGuard-MCP live demo API (New + > Blueprint > select this repo).
services:
  - type: web
    name: omniguard-mcp-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn omniguard.api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: OMNIGUARD_LIVE_DIR
        value: /tmp/omniguard_live
      - key: OMNIGUARD_LIVE_BATCH
        value: "4"
